name: Build ARM64 APK

on:
  push:
    branches: [main]
    paths:
      - 'build.sh'
      - 'args.gn'
      - '.gclient'
      - '.github/workflows/build.yml'
      - 'patch.sh'
      - 'vanadium'
      - 'extensions/**'
      - 'res/**'
  workflow_dispatch:

permissions:
  contents: write

# Do not cancel a long Chromium compile just because another commit is pushed.
concurrency:
  group: king-browser-arm64-build
  cancel-in-progress: false

jobs:
  build:
    name: Build Titanium ARM64 APK
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout source
        uses: actions/checkout@v5
        with:
          submodules: true

      # Restore the newest compatible partial compile cache from an earlier run.
      - name: Restore Chromium compile cache
        uses: actions/cache/restore@v4
        with:
          path: |
            chromium/src/out/Default/obj
            chromium/src/out/Default/.ninja_log
            chromium/src/out/Default/.ninja_deps
          key: king-browser-arm64-v3-${{ hashFiles('args.gn', '.gclient') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            king-browser-arm64-v3-${{ hashFiles('args.gn', '.gclient') }}-

      - name: Set build timestamp
        run: echo "UNIX_TIME=$(date +%s)" >> "$GITHUB_ENV"

      - name: Build and sign ARM64 APK
        timeout-minutes: 350
        env:
          DEBIAN_FRONTEND: noninteractive
          LOCAL_TEST_JKS: ${{ secrets.LOCAL_TEST_JKS }}
          STORE_TEST_JKS: ${{ secrets.STORE_TEST_JKS }}
        run: |
          chmod +x ./*.sh
          ./build.sh

      # Save compiled objects after the build step's time budget, even if it times out.
      - name: Save Chromium compile cache
        if: always()
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: |
            chromium/src/out/Default/obj
            chromium/src/out/Default/.ninja_log
            chromium/src/out/Default/.ninja_deps
          key: king-browser-arm64-v3-${{ hashFiles('args.gn', '.gclient') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Prepare release APK
        id: release
        shell: bash
        run: |
          set -euo pipefail
          APK_PATH="$(find chromium/src/out/release -maxdepth 1 -type f -name '*-arm64-v8a.apk' -print -quit)"
          if [[ -z "$APK_PATH" ]]; then
            echo "Signed ARM64 APK was not produced." >&2
            exit 1
          fi
          VERSION="${APK_PATH##*/}"
          VERSION="${VERSION%-arm64-v8a.apk}"
          RELEASE_FILE="KING-BROWSER-${VERSION}-${UNIX_TIME}-arm64-v8a.apk"
          mv "$APK_PATH" "$RELEASE_FILE"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "file=$RELEASE_FILE" >> "$GITHUB_OUTPUT"
          echo "tag=king-browser-${VERSION}-${UNIX_TIME}" >> "$GITHUB_OUTPUT"

      - name: Publish APK release
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: KING-BROWSER ${{ steps.release.outputs.version }} (ARM64)
          tag_name: ${{ steps.release.outputs.tag }}
          body: |
            KING-BROWSER Android build.
            Architecture: ARM64 (arm64-v8a)
            Package: APK only.
          files: ${{ steps.release.outputs.file }}
          fail_on_unmatched_files: true

# Preserve partial Chromium compilation between bounded build attempts.
