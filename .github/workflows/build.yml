name: Build Basic Browser

on:
  workflow_dispatch:
    inputs:
      runner:
        description: 'Runner'
        required: true
        type: string
        default: 'ubuntu-latest'

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Update browser source
        run: |
          cd vanadium
          git fetch --tags
          git checkout $(git tag | sort -V | tail -n1)
          cd ..
          git add vanadium
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          if ! git diff --staged --quiet; then
            git commit -m "update browser source"
            git push
          fi

      - name: Set environment
        run: |
          chmod +x *.sh
          echo "unix_time=$(date +%s)" >> "$GITHUB_ENV"

      - name: Build basic ARM64 APK
        env:
          DEBIAN_FRONTEND: noninteractive
          LOCAL_TEST_JKS: ${{ secrets.LOCAL_TEST_JKS }}
          STORE_TEST_JKS: ${{ secrets.STORE_TEST_JKS }}
        run: ./build.sh

      - name: Prepare APK
        run: |
          APK=$(find chromium/src/out/release -name '*arm64-v8a.apk' | head -n1)
          test -n "$APK"
          VERSION=$(basename "$APK" -arm64-v8a.apk)
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mv "$APK" "$VERSION-${{ env.unix_time }}-arm64-v8a.apk"

      - name: Publish APK
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          name: Basic Browser v${{ env.VERSION }}
          tag_name: basic-v${{ env.VERSION }}-${{ env.unix_time }}
          files: |
            ${{ env.VERSION }}-${{ env.unix_time }}-arm64-v8a.apk
