name: KING-BROWSER Lite APK

on:
  push:
    branches: [lite-browser]
    paths:
      - 'lite-browser/**'
      - '.github/workflows/lite-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: king-browser-lite
  cancel-in-progress: true

jobs:
  build:
    name: Build lightweight Android WebView APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-35 build-tools;35.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Prepare Android image resources
        run: |
          set -e
          cd lite-browser/app/src/main/res/drawable-nodpi
          # The current uploaded assets are PNG files; preserve their original formats.
          test -s king_browser_lite_icon_transparent_512.png
          test -s king_browser_background.png
          cp king_browser_lite_icon_transparent_512.png king_browser_logo.png
          test -s king_browser_logo.png
          test -s king_browser_background.png

      - name: Build debug APK
        working-directory: lite-browser
        run: gradle --no-daemon :app:assembleDebug

      - name: Rename APK for download
        run: |
          mkdir -p lite-browser/dist
          cp lite-browser/app/build/outputs/apk/debug/app-debug.apk "lite-browser/dist/King browser lite.apk"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: King browser lite
          path: lite-browser/dist/King browser lite.apk
          if-no-files-found: error
          retention-days: 14
