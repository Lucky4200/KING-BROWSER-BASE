name: KING-BROWSER Lite APK

on:
  push:
    branches: [lite-browser]
    paths:
      - 'lite-browser/**'
      - '.github/workflows/lite-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: king-browser-lite
  cancel-in-progress: true

jobs:
  build:
    name: Build ARM64 Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Download and prepare uBlock Origin Firefox extension
        run: |
          set -euo pipefail
          ASSETS="lite-browser/app/src/main/assets/ublock"
          mkdir -p "$ASSETS"
          curl -fL --retry 3 --retry-delay 2 \
            "https://github.com/gorhill/uBlock/releases/download/1.76.0/uBlock0_1.76.0.firefox.signed.xpi" \
            -o /tmp/ublock-origin.xpi
          unzip -q /tmp/ublock-origin.xpi -d "$ASSETS"
          test -s "$ASSETS/manifest.json"
          grep -q "uBlock0@raymondhill.net" "$ASSETS/manifest.json"

      - name: Verify uploaded Android image resources
        run: |
          set -e
          RES="lite-browser/app/src/main/res/drawable-nodpi"
          test -s "$RES/king_browser_lite_icon_transparent_512.png"
          test -s "$RES/king_browser_background.png"

      - name: Build ARM64 debug APK
        working-directory: lite-browser
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK ABI and package
        run: |
          set -euo pipefail
          APK="lite-browser/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | grep -q "package: name='com.kingbrowser.lite.debug'"
          unzip -l "$APK" | grep -q "lib/arm64-v8a/"

      - name: Rename APK for download
        run: |
          mkdir -p lite-browser/dist
          cp lite-browser/app/build/outputs/apk/debug/app-debug.apk "lite-browser/dist/King browser lite.apk"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: King browser lite ARM64
          path: lite-browser/dist/King browser lite.apk
          if-no-files-found: error
          retention-days: 14
