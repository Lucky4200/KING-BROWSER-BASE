name: KING-BROWSER Lite APK

on:
  push:
    branches: [lite-browser]
    paths:
      - 'lite-browser/**'
      - '.github/workflows/lite-browser.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: king-browser-lite
  cancel-in-progress: true

jobs:
  build:
    name: Build lightweight Android WebView APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        working-directory: lite-browser
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: KING-BROWSER-Lite-debug
          path: lite-browser/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
